name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned IPA
        run: |
          xcodebuild -project GymLog.xcodeproj -scheme GymLog -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R "$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphoneos/GymLog.app' -type d | head -n 1)" Payload/
          zip -r GymLog-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GymLog-unsigned-ipa
          path: GymLog-unsigned.ipa
      - name: Publish IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create gym-log-v0.1.0 GymLog-unsigned.ipa --title "GymLog v0.1.0" --notes "Unsigned IPA build for sideloading."
