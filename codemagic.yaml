workflows:
  ios-unsigned-ipa:
    name: GymLog IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Generate Xcode project
        script: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Build unsigned IPA
        script: |
          xcodebuild -project GymLog.xcodeproj -scheme GymLog -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R "$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphoneos/GymLog.app' -type d | head -n 1)" Payload/
          zip -r GymLog-unsigned.ipa Payload
    artifacts:
      - GymLog-unsigned.ipa
